blueprint:
  name: Reproducir música desde una etiqueta NFC
  description: Reproduce la dirección musical de una etiqueta NDEF.
  domain: automation
  input:
    reader_name:
      name: Nombre técnico del lector
      description: Debe coincidir con substitutions.name del firmware, no con el nombre visible del dispositivo.
      default: nfckizi1
      selector:
        text:
    reader_id:
      name: Dispositivo lector NFC de ESPHome
      description: Selecciona tu lector NFC.
      selector:
        device:
          integration: esphome
    player:
      name: Reproductor multimedia
      description: Selecciona el reproductor asociado a este lector.
      selector:
        entity:
          domain: media_player

variables:
    device_id: !input reader_id
    reader: !input reader_name

trigger:
  - platform: event
    event_type: esphome.music_tag
condition:
  - condition: template
    value_template: '{{ trigger.event.data.reader == reader }}'
action:
  - service: media_player.media_stop
    target:
      entity_id: !input player
  - choose:
      - conditions:
          - condition: template
            value_template: '{{ trigger.event.data.source == "sonos" }}'
        sequence:
          - service: media_player.select_source
            data:
              source: '{{ trigger.event.data.info }}'
            target:
              entity_id: !input player
    default:
      - service: media_player.play_media
        data:
          media_content_type: music
          media_content_id: '{{ trigger.event.data.url }}'
        target:
          entity_id: !input player
mode: queued
max: 10
