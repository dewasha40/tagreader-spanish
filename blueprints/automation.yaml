alias: NFC - Reproducir música de nfckizi1
description: Ejemplo musical de nfckizi1; sustituye el lector y la entidad del reproductor por los tuyos.
trigger:
  - platform: event
    event_type: esphome.music_tag
    event_data: {}
condition:
  - condition: template
    value_template: "{{ trigger.event.data.reader == \"nfckizi1\" }}"
action:
  - service: media_player.play_media
    target:
      entity_id: media_player.kinderzimmer_1
    data:
      media_content_id: "{{ trigger.event.data.url }}"
      media_content_type: music
    metadata: {}
mode: queued
max: 10