substitutions:
  name: nfckizi1
  friendly_name: Lector NFC

esphome:
  name: $name
  friendly_name: $friendly_name
  # Añadir automáticamente la dirección MAC al nombre
  # para utilizar un mismo firmware en todos los dispositivos
  #name_add_mac_suffix: true

  # Permite identificar el proyecto y gestionar
  # su configuración y actualizaciones.
  project:
    name: adonno.tag_reader
    version: "1.4"
    # Avisar cuando la conexión con la API esté lista
  on_boot:
    priority: -10
    then:
    - wait_until:
        api.connected:
    - logger.log: ¡API conectada!
    - rtttl.play: "success:d=24,o=5,b=100:c,g,b"
    - light.turn_on:
        id: activity_led
        brightness: 100%
        red: 0%
        green: 0%
        blue: 100%
        flash_length: 500ms
    - switch.turn_on: buzzer_enabled
    - switch.turn_on: led_enabled

esp32:
  board: esp32dev
  framework:
    type: arduino

dashboard_import:
  package_import_url: github://dewasha40/tagreader-spanish/tagreader.yaml@master


wifi:
  id: wifi_link
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Activar el punto de acceso de recuperación si falla la conexión Wi-Fi
  ap:
    ssid: "Lector NFC - Configuración"
    password: !secret defaultfallbackpw

captive_portal:
switch:
- platform: template
  name: "${friendly_name} Zumbador activado"
  id: buzzer_enabled
  icon: mdi:volume-high
  optimistic: true
  restore_mode: RESTORE_DEFAULT_ON
  entity_category: config
- platform: template
  name: "${friendly_name} LED activado"
  id: led_enabled
  icon: mdi:alarm-light-outline
  optimistic: true
  restore_mode: RESTORE_DEFAULT_ON
  entity_category: config

# Botones para escribir etiquetas desde Home Assistant
button:
  - platform: template
    name: "${friendly_name} Escribir etiqueta aleatoria"
    id: write_tag_random
    # Opciones adicionales:
    icon: "mdi:pencil-box"
    on_press:
      then:
      - light.turn_on:
          id: activity_led
          brightness: 100%
          red: 100%
          green: 0%
          blue: 100%
      - lambda: |-
          static const char alphanum[] = "0123456789abcdef";
          std::string uri = "https://www.home-assistant.io/tag/";
          for (int i = 0; i < 8; i++)
            uri += alphanum[random_uint32() % (sizeof(alphanum) - 1)];
          uri += "-";
          for (int j = 0; j < 3; j++) {
            for (int i = 0; i < 4; i++)
              uri += alphanum[random_uint32() % (sizeof(alphanum) - 1)];
            uri += "-";
          }
          for (int i = 0; i < 12; i++)
            uri += alphanum[random_uint32() % (sizeof(alphanum) - 1)];
          auto message = new nfc::NdefMessage();
          message->add_uri_record(uri);
          ESP_LOGD("tagreader", "Escribiendo contenido: %s", uri.c_str());
          id(screen_status)="Acerca para escribir";
          id(pn532_board).write_mode(message);
      - rtttl.play: "write:d=24,o=5,b=100:b"
      - wait_until:
          not:
            pn532.is_writing:
      - lambda: 'if (id(screen_status)!="Escritura cancelada") id(screen_status)="Verifica la etiqueta";'
      - light.turn_off:
          id: activity_led
      - rtttl.play: "write:d=24,o=5,b=100:b,b"
  - platform: template
    name: "${friendly_name} Borrar etiqueta"
    id: clean_tag
    icon: "mdi:nfc-variant-off"
    on_press:
      then:
      - light.turn_on:
          id: activity_led
          brightness: 100%
          red: 100%
          green: 64.7%
          blue: 0%
      - lambda: 'id(screen_status)="Acerca para borrar"; id(pn532_board).clean_mode();'
      - rtttl.play: "write:d=24,o=5,b=100:b"
      - wait_until:
          not:
            pn532.is_writing:
      - lambda: 'if (id(screen_status)!="Escritura cancelada") id(screen_status)="Verifica la etiqueta";'
      - light.turn_off:
          id: activity_led
      - rtttl.play: "write:d=24,o=5,b=100:b,b"
  - platform: template
    name: "${friendly_name} Cancelar escritura"
    id: cancel_writing
    icon: "mdi:pencil-off"
    on_press:
      then:
      - lambda: 'id(screen_status)="Escritura cancelada"; id(pn532_board).read_mode();'
      - light.turn_off:
          id: activity_led
      - rtttl.play: "write:d=24,o=5,b=100:b,b"

  - platform: restart
    name: "${friendly_name} Reiniciar"
    entity_category: config
# Activar el registro
logger:
  # level: VERY_VERBOSE
  # level: VERBOSE

# Activar la API de Home Assistant
api:
  encryption:
    key: !secret encryptionkey
  services:
  - service: rfidreader_tag_ok
    then:
    - rtttl.play: "beep:d=16,o=5,b=100:b"

  - service: rfidreader_tag_ko
    then:
    - rtttl.play: "beep:d=8,o=5,b=100:b"

  - service: play_rtttl
    variables:
      song_str: string
    then:
    - rtttl.play: !lambda 'return song_str;'

  - service: write_tag_id
    variables:
      tag_id: string
    then:
    - light.turn_on:
        id: activity_led
        brightness: 100%
        red: 100%
        green: 0%
        blue: 0%
    - lambda: |-
        auto message = new nfc::NdefMessage();
        std::string uri = "https://www.home-assistant.io/tag/";
        uri += tag_id;
        message->add_uri_record(uri);
        id(screen_status)="Acerca para escribir";
        id(pn532_board).write_mode(message);
    - rtttl.play: "write:d=24,o=5,b=100:b"
    - wait_until:
        not:
          pn532.is_writing:
    - lambda: 'if (id(screen_status)!="Escritura cancelada") id(screen_status)="Verifica la etiqueta";'
    - light.turn_off:
        id: activity_led
    - rtttl.play: "write:d=24,o=5,b=100:b,b"

  - service: write_music_tag
    variables:
      music_url: string
      music_info: string
    then:
    - light.turn_on:
        id: activity_led
        brightness: 100%
        red: 100%
        green: 0%
        blue: 0%
    - lambda: |-
        auto message = new nfc::NdefMessage();
        std::string uri = "";
        std::string text = "";
        uri += music_url;
        text += music_info;
        if ( music_url != "" ) {
          message->add_uri_record(uri);
        }
        if ( music_info != "" ) {
          message->add_text_record(text);
        }
        id(screen_status)="Acerca para escribir";
        id(pn532_board).write_mode(message);
    - rtttl.play: "write:d=24,o=5,b=100:b"
    - wait_until:
        not:
          pn532.is_writing:
    - lambda: 'if (id(screen_status)!="Escritura cancelada") id(screen_status)="Verifica la etiqueta";'
    - light.turn_off:
        id: activity_led
    - rtttl.play: "write:d=24,o=5,b=100:b,b"

# Actualizaciones inalámbricas OTA
ota:
  - platform: esphome
    password: !secret otapassword

i2c:
  sda: GPIO21
  scl: GPIO22
  scan: False
  frequency: 400kHz

globals:
  - id: screen_status
    type: std::string
    initial_value: '"Acerca una etiqueta"'
  - id: last_uid
    type: std::string
    initial_value: '"Sin lecturas"'
  - id: tag_count
    type: int
    initial_value: '0'
  - id: tag_present
    type: bool
    initial_value: 'false'
  - id: source
    type: std::string
  - id: url
    type: std::string
  - id: info
    type: std::string

pn532_i2c:
  id: pn532_board
  on_tag:
    then:
    - if:
        condition:
          switch.is_on: led_enabled
        then:
        - light.turn_on:
            id: activity_led
            brightness: 100%
            red: 0%
            green: 100%
            blue: 0%
            flash_length: 500ms

    - delay: 0.15s # Pausa para evitar lentitud del componente

    - lambda: |-
        id(last_uid)=x;
        id(tag_count)++;
        id(tag_present)=true;
        id(screen_status)="Etiqueta detectada";
        id(source)="";
        id(url)="";
        id(info)="";
        if (tag.has_ndef_message()) {
          const auto &message = tag.get_ndef_message();
          const auto &records = message->get_records();
          for (auto &record : records) {
            std::string payload = record->get_payload();
            std::string type = record->get_type();
            size_t hass = payload.find("https://www.home-assistant.io/tag/");
            size_t applemusic = payload.find("https://music.apple.com");
            size_t spotify = payload.find("https://open.spotify.com");
            size_t sonos = payload.find("sonos-2://");

            if (type == "U" and hass != std::string::npos ) {
              ESP_LOGD("tagreader", "Etiqueta NDEF de Home Assistant detectada");
              id(source)="hass";
              id(url)=payload;
              id(info)=payload.substr(hass + std::string("https://www.home-assistant.io/tag/").size());
            }
            else if (type == "U" and applemusic != std::string::npos ) {
              ESP_LOGD("tagreader", "Etiqueta NDEF de Apple Music detectada");
              id(source)="amusic";
              id(url)=payload;
            }
            else if (type == "U" and spotify != std::string::npos ) {
              ESP_LOGD("tagreader", "Etiqueta NDEF de Spotify detectada");
              id(source)="spotify";
              id(url)=payload;
            }
            else if (type == "U" and sonos != std::string::npos ) {
              ESP_LOGD("tagreader", "Etiqueta NDEF de Sonos detectada");
              id(source)="sonos";
              id(url)=payload;
            }
            else if (type == "T" ) {
              ESP_LOGD("tagreader", "Información musical NDEF detectada");
              id(info)=payload;
            }
            else if ( id(source)=="" ) {
              id(source)="uid";
            }
          }
        }
        else {
          id(source)="uid";
        }

    - if:
        condition:
          lambda: 'return ( id(source)=="uid" );'
        then:
          - homeassistant.tag_scanned: !lambda |-
              ESP_LOGD("tagreader", "Sin NDEF de Home Assistant; se utiliza el UID");
              return x;
        else:
        - if:
            condition:
              lambda: 'return ( id(source)=="hass" );'
            then:
            - homeassistant.tag_scanned: !lambda 'return id(info);'
            else:
            - homeassistant.event:
                event: esphome.music_tag
                data:
                  reader: !lambda |-
                    return App.get_name().c_str();
                  source: !lambda |-
                    return id(source);
                  url: !lambda |-
                    return id(url);
                  info: !lambda |-
                    return id(info);

    - if:
        condition:
          switch.is_on: buzzer_enabled
        then:
        - rtttl.play: "success:d=24,o=5,b=100:c,g,b"
  on_tag_removed:
    then:
    - lambda: 'id(tag_present)=false; id(screen_status)="Etiqueta retirada";'
    - homeassistant.event:
        event: esphome.tag_removed
# Salida del zumbador
output:
- platform: ledc
  pin: GPIO12
  id: buzzer

binary_sensor:
  - platform: status
    id: ha_connected
    name: "${friendly_name} Estado"
    entity_category: diagnostic


text_sensor:
  - platform: version
    hide_timestamp: true
    name: "${friendly_name} Versión de ESPHome"
    entity_category: diagnostic
  - platform: wifi_info
    ip_address:
      name: "${friendly_name} Dirección IP"
      icon: mdi:wifi
      entity_category: diagnostic
    ssid:
      name: "${friendly_name} Red Wi-Fi conectada"
      icon: mdi:wifi-strength-2
      entity_category: diagnostic

# Utilizar el zumbador para las melodías RTTTL
rtttl:
  output: buzzer

# Configuración del LED
light:
- platform: esp32_rmt_led_strip
  chipset: WS2812
  pin: GPIO15
  num_leds: 1
  flash_transition_length: 500ms
  channel_colors: GRB
  id: activity_led
  name: "${friendly_name} LED"
  restore_mode: ALWAYS_OFF
